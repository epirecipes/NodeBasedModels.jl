# Golden for NodeBasedModels test area "graph_level". Generated by test/golden/generate.jl;
# do not edit by hand. Replace only in a bug-fix change of the owning work package.
area = "graph_level"
atol = 1.0e-10
description = "IB SIR on the depth-4 binary tree, root infected"
format = 1
known_defects = []
name = "ib_sir_tree_root"
rtol = 1.0e-8

[meta]
graph = "tree"
kind = "generate_individual_based"
notes = []
solver = "OrdinaryDiffEqDefault default algorithm, reltol = 1e-10, abstol = 1e-12, saveat = 0:1:T (re-solve of result.sol.prob)"
tspan = [0.0, 30.0]

    [meta.keywords]
    infection_rate = 0.5
    initial_infected = [1]
    recovery_rate = 0.25

    [meta.model]
    compartments = ["S", "I", "R"]
    infectious = ["I"]
    name = "SIR"
    susceptible = ["S"]
    transitions = ["S -> I [τ, infection]", "I -> R [γ, spontaneous]"]

    [meta.network]
    directed = false
    edges = ["1-2", "1-3", "2-4", "2-5", "3-6", "3-7", "4-8", "4-9", "5-10", "5-11", "6-12", "6-13", "7-14", "7-15"]
    ne = 14
    nv = 15
    transmission_matrix = "nothing (uniform infection_rate)"
    type = "GraphNetwork"

[provenance]
Graphs = "1.14.0"
ModelingToolkit = "11.17.0"
NodeBasedModels = "0.1.0"
OrdinaryDiffEqDefault = "1.14.0"
Symbolics = "7.17.0"
generator = "test/golden/generate.jl"
julia = "1.12.7"

[scalars]
N = 15
n_states = 30

[structure]
