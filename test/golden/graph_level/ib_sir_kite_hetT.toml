# Golden for NodeBasedModels test area "graph_level". Generated by test/golden/generate.jl;
# do not edit by hand. Replace only in a bug-fix change of the owning work package.
area = "graph_level"
atol = 1.0e-10
description = "IB SIR on Krackhardt's kite with an explicit heterogeneous transmission matrix"
format = 1
known_defects = []
name = "ib_sir_kite_hetT"
rtol = 1.0e-8

[meta]
graph = "kite"
kind = "generate_individual_based"
notes = []
solver = "OrdinaryDiffEqDefault default algorithm, reltol = 1e-10, abstol = 1e-12, saveat = 0:1:T (re-solve of result.sol.prob)"
tspan = [0.0, 30.0]

    [meta.keywords]
    initial_infected = [1]
    recovery_rate = 0.25

    [meta.model]
    compartments = ["S", "I", "R"]
    infectious = ["I"]
    name = "SIR"
    susceptible = ["S"]
    transitions = ["S -> I [τ, infection]", "I -> R [γ, spontaneous]"]

    [meta.network]
    directed = false
    edges = ["1-2", "1-3", "1-4", "1-6", "2-4", "2-5", "2-7", "3-4", "3-6", "4-5", "4-6", "4-7", "5-7", "6-7", "6-8", "7-8", "8-9", "9-10"]
    ne = 18
    nv = 10
    transmission_matrix = "explicit (see case builder)"
    type = "GraphNetwork"

[provenance]
Graphs = "1.14.0"
ModelingToolkit = "11.17.0"
NodeBasedModels = "0.1.0"
OrdinaryDiffEqDefault = "1.14.0"
Symbolics = "7.17.0"
generator = "test/golden/generate.jl"
julia = "1.12.7"

[scalars]
N = 10
n_states = 20

[structure]
layout = ["I_1", "I_10", "I_2", "I_3", "I_4", "I_5", "I_6", "I_7", "I_8", "I_9", "S_1", "S_10", "S_2", "S_3", "S_4", "S_5", "S_6", "S_7", "S_8", "S_9"]
state_names = ["I", "S"]

[tables.rhs_probe]
columns = ["x:I_1", "x:I_10", "x:I_2", "x:I_3", "x:I_4", "x:I_5", "x:I_6", "x:I_7", "x:I_8", "x:I_9", "x:S_1", "x:S_10", "x:S_2", "x:S_3", "x:S_4", "x:S_5", "x:S_6", "x:S_7", "x:S_8", "x:S_9", "f:I_1", "f:I_10", "f:I_2", "f:I_3", "f:I_4", "f:I_5", "f:I_6", "f:I_7", "f:I_8", "f:I_9", "f:S_1", "f:S_10", "f:S_2", "f:S_3", "f:S_4", "f:S_5", "f:S_6", "f:S_7", "f:S_8", "f:S_9"]
