# Golden for NodeBasedModels test area "pairwise". Generated by test/golden/generate.jl;
# do not edit by hand. Replace only in a bug-fix change of the owning work package.
area = "pairwise"
atol = 4.0e-10
description = "SEIR, 4-regular, Bernoulli closure; seeds I (0.1 default)"
format = 1
known_defects = []
name = "seir_hom4_bernoulli_seedI"
rtol = 1.0e-8

[meta]
N = 1.0
closure = "BernoulliClosure()"
notes = ["0.1 seeding via seed_state = :first_infectious: the first infectious compartment I (not the entry state E) holds seed_fraction"]
seed_fraction = 0.01
seed_state = "first_infectious"
solver = "OrdinaryDiffEqDefault default algorithm, reltol = 1e-10, abstol = 1e-12, saveat = 0:1:T"
tspan = [0.0, 40.0]

    [meta.model]
    compartments = ["S", "E", "I", "R"]
    infectious = ["I"]
    name = "seir"
    susceptible = ["S"]
    transitions = ["S -> E [τ, infection]", "E -> I [σ, spontaneous]", "I -> R [γ, spontaneous]"]

    [meta.network]
    N = 1.0
    n = 4
    phi = 0.0
    type = "HomogeneousNetwork"

    [meta.params]
    "γ" = 0.2
    "σ" = 0.5
    "τ" = 0.3

[provenance]
Graphs = "1.14.0"
ModelingToolkit = "11.17.0"
NodeBasedModels = "0.1.0"
OrdinaryDiffEqDefault = "1.14.0"
Symbolics = "7.17.0"
generator = "test/golden/generate.jl"
julia = "1.12.7"

[scalars]
n_equations = 14
retcode = "Success"

[structure]
parameters = ["γ", "σ", "τ"]
u0_keys = ["[E]", "[E|E]", "[E|I]", "[E|R]", "[I]", "[I|I]", "[I|R]", "[R]", "[R|R]", "[S]", "[S|E]", "[S|I]", "[S|R]", "[S|S]"]
unknowns = ["[E]", "[E|E]", "[E|I]", "[E|R]", "[I]", "[I|I]", "[I|R]", "[R]", "[R|R]", "[S]", "[S|E]", "[S|I]", "[S|R]", "[S|S]"]

[tables.rhs_probe]
columns = ["x:[E]", "x:[E|E]", "x:[E|I]", "x:[E|R]", "x:[I]", "x:[I|I]", "x:[I|R]", "x:[R]", "x:[R|R]", "x:[S]", "x:[S|E]", "x:[S|I]", "x:[S|R]", "x:[S|S]", "f:[E]", "f:[E|E]", "f:[E|I]", "f:[E|R]", "f:[I]", "f:[I|I]", "f:[I|R]", "f:[R]", "f:[R|R]", "f:[S]", "f:[S|E]", "f:[S|I]", "f:[S|R]", "f:[S|S]"]
