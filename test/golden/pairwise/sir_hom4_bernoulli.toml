# Golden for NodeBasedModels test area "pairwise". Generated by test/golden/generate.jl;
# do not edit by hand. Replace only in a bug-fix change of the owning work package.
area = "pairwise"
atol = 4.0e-10
description = "SIR, 4-regular, Bernoulli closure"
format = 1
known_defects = []
name = "sir_hom4_bernoulli"
rtol = 1.0e-8

[meta]
N = 1.0
closure = "BernoulliClosure()"
notes = []
seed_fraction = 0.01
solver = "OrdinaryDiffEqDefault default algorithm, reltol = 1e-10, abstol = 1e-12, saveat = 0:1:T"
tspan = [0.0, 40.0]

    [meta.model]
    compartments = ["S", "I", "R"]
    infectious = ["I"]
    name = "SIR"
    susceptible = ["S"]
    transitions = ["S -> I [τ, infection]", "I -> R [γ, spontaneous]"]

    [meta.network]
    N = 1.0
    n = 4
    phi = 0.0
    type = "HomogeneousNetwork"

    [meta.params]
    "γ" = 0.2
    "τ" = 0.3

[provenance]
Graphs = "1.14.0"
ModelingToolkit = "11.17.0"
NodeBasedModels = "0.1.0"
OrdinaryDiffEqDefault = "1.14.0"
Symbolics = "7.17.0"
generator = "test/golden/generate.jl"
julia = "1.12.7"

[scalars]
n_equations = 9
retcode = "Success"

[structure]
parameters = ["γ", "τ"]
u0_keys = ["[I]", "[I|I]", "[I|R]", "[R]", "[R|R]", "[S]", "[S|I]", "[S|R]", "[S|S]"]
unknowns = ["[I]", "[I|I]", "[I|R]", "[R]", "[R|R]", "[S]", "[S|I]", "[S|R]", "[S|S]"]

[tables.rhs_probe]
columns = ["x:[I]", "x:[I|I]", "x:[I|R]", "x:[R]", "x:[R|R]", "x:[S]", "x:[S|I]", "x:[S|R]", "x:[S|S]", "f:[I]", "f:[I|I]", "f:[I|R]", "f:[R]", "f:[R|R]", "f:[S]", "f:[S|I]", "f:[S|R]", "f:[S|S]"]
file = "sir_hom4_bernoulli.rhs_probe.csv"
rows = 3

[tables.trajectory]
columns = ["t", "[I]", "[I|I]", "[I|R]", "[R]", "[R|R]", "[S]", "[S|I]", "[S|R]", "[S|S]"]
file = "sir_hom4_bernoulli.trajectory.csv"
rows = 41
