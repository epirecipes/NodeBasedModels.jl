             "sir_pl_N1000", "sir_pl_N100000", "seair_pois5"]   # :seair_pois5 in shared-cell-E06 (E06's list)
layers = ["L", "F", "S"]
mirrors = ["E03", "E06"]   # two shared cells: shared-cell-E03 and shared-cell-E06
summaries = true

