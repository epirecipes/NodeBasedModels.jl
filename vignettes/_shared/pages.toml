# Owner: V-NBM-infra. The page catalogue of the NodeBasedModels.jl vignettes (DESIGN_NetworkEpiCore.md §F.2, plus
# the stretch page N14 of WP36e). One table per page. A page lives in the directory `<id>_<slug>/index.qmd` (any
# slug); `index.qmd` links it once it exists and lists it as "in preparation" until then, and
# `_shared/check_pages.jl` checks it against this catalogue.
#
#   title      the page title (the page's own front matter should use the same title)
#   scenarios  the registered scenario ids the page uses (mirrored pages use the same ids; rule 5/7)
#   layers     L = low-level front end, F = factory, T = transform or composition, M = morphism / verify,
#              S = NetworkOutbreaks simulation overlay
#   mirrors    the EdgeBasedModels.jl pages this page mirrors (the cross-references of DESIGN §F.1/§F.2). Each mirrored
#              pair shares ONE cell, textually identical apart from back-end lines and using the same scenario ids
#              (rule 5/7): the cell labelled `shared-cell-<E>` on this page if there is one, else `shared-cell`
#              (and `shared-cell-<N>` / `shared-cell` on the EBM page). The rest of the two pages may use different
#              scenarios, as the DESIGN tables do (E10 adds :sir_unstr2, N04 :sir_reg6_fixed; they share :sir_sbm2).
#              N02 mirrors both E03 and E06, whose shared cells differ, so N02 carries `shared-cell-E03` and
#              `shared-cell-E06`; E03 and E06 need not share a cell with each other.
#   summaries  whether the page compares with committed NO summaries (true: `require_summaries(scenarios)`)

[N01]
title = "From a reaction network to a pairwise model"
scenarios = ["sir_pois5", "sir_reg6"]
layers = ["L", "F", "S"]
mirrors = ["E01"]
summaries = true

